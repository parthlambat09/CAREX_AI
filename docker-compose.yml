version: '3.8'

services:
  # ============================================================================
  # CAREX FastAPI & LightGBM/TreeSHAP Clinical Inference Engine
  # ============================================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    container_name: carex-backend
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - PYTHONUNBUFFERED=1
    volumes:
      - ./backend:/app/backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ============================================================================
  # CAREX React + Vite Portals (Doctor, Nurse, Hospital Admin, Patient)
  # ============================================================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    container_name: carex-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_BACKEND_URL=http://backend:8000
      - VITE_WS_BACKEND_URL=ws://backend:8000
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

networks:
  default:
    name: carex-network
